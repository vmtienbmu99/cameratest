<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký chương trình</title>
  <link rel="stylesheet" href="./assets/style.css?v=logo2">
  <script>
    window.BMU_CONFIG = {
      API_URL: 'https://script.google.com/macros/s/AKfycbxIWCsUGOnDCo_FEQC33siIrtXB01DCx32U1fpc4v47iS5Cx6gw7mflP-nBljLtvA5t/exec',
      API_NAME: 'BMU - Đăng ký & Điểm danh',
      ALLOWED_DOMAIN: 'bmu.edu.vn',
      APP_NAME: 'Hệ thống Đăng ký & Điểm danh'
    };
  </script>
  
  <script src="./assets/api.js?v=20261102a"></script>
</head>
<body>
  <div class="topbar"><div class="wrap"><div class="brand">
    <div class="app-logo">
      <img src="./assets/logo.png?v=logo2" alt="Logo Trường">
    </div>
    <span>Hệ thống Đăng ký & Điểm danh</span></div></div></div>

  <main class="page">
    <section class="card">
      <h1>Đăng ký tham gia chương trình</h1>
      <div id="programBox" class="alert info">Đang tải thông tin chương trình...</div>
      <div id="authBox" class="hidden"></div>
      <div id="studentBox" class="hidden"></div>
      <button class="btn hidden" id="btnRegister" onclick="submitRegistration()">Xác nhận đăng ký</button>
      <div id="result"></div>
    </section>
  </main>

<script>
const programId = getParam('programId');
let currentProgram = null;
let currentStudent = null;
let currentToken = '';

const programBox = document.getElementById('programBox');
const authBox = document.getElementById('authBox');
const studentBox = document.getElementById('studentBox');
const btnRegister = document.getElementById('btnRegister');
const result = document.getElementById('result');

init();

async function init(){
  if (!programId){
    programBox.className = 'alert danger';
    programBox.textContent = 'Thiếu mã chương trình trên đường link.';
    return;
  }

  try{
    const auth = getAuth();
    const res = await apiGet('init-register', { programId: programId, authToken: auth.token });
    if (!res.ok) throw new Error(res.message || 'Không lấy được dữ liệu.');
    if (!res.program || !res.program.ok) throw new Error(res.program && res.program.message ? res.program.message : 'Không tìm thấy chương trình.');

    currentProgram = res.program;
    renderProgram(currentProgram);
    startLiveRefresh();

    if (res.auth && res.auth.ok){
      currentToken = auth.token;
      currentStudent = res.auth.student;
      saveAuth(currentToken, currentStudent.email, currentStudent);
      renderStudent(currentStudent);
    } else {
      clearAuth();
      renderAuth();
    }
  }catch(err){
    programBox.className = 'alert danger';
    programBox.textContent = err.message || err;
  }
}

function renderProgram(p){
  programBox.className = '';
  programBox.innerHTML = `
    <div class="info-row"><span class="label">Mã chương trình</span><span class="value">${esc(programId)}</span></div>
    <div class="info-row"><span class="label">Chương trình</span><span class="value">${esc(p.tenChuongTrinh || '')}</span></div>
    <div class="info-row"><span class="label">Địa điểm</span><span class="value">${esc(p.diaDiem || '—')}</span></div>
    <div class="info-row"><span class="label">Thời gian tổ chức</span><span class="value">${esc(p.thoiGianToChuc || '—')}</span></div>
    <div class="info-row"><span class="label">Trạng thái đăng ký</span><span class="value" id="statusValue">${esc(p.trangThaiDangKy || '—')}</span></div>
    <div class="info-row"><span class="label">Số lượng</span><span class="value"><span id="countValue">${esc(p.soLuongDaDangKy || 0)}</span> / ${esc(p.soLuongGioiHan || 'Không giới hạn')}</span></div>
  `;
}

function renderAuth(){
  btnRegister.classList.add('hidden');
  studentBox.classList.add('hidden');
  authBox.classList.remove('hidden');
  authBox.innerHTML = `
    <h3>Xác thực email trường</h3>
    <div class="alert info">Nhập email trường để nhận mã OTP. Hệ thống chỉ chấp nhận email có trong danh sách sinh viên.</div>
    <div class="form-group">
      <label>Email trường</label>
      <input id="emailInput" type="email" placeholder="vd: mssv@bmu.edu.vn" autocomplete="email">
    </div>
    <button class="btn" id="btnSendOtp" onclick="sendOtp()">Gửi mã xác thực</button>
    <div id="otpArea" class="hidden">
      <div class="form-group" style="margin-top:16px">
        <label>Mã OTP</label>
        <input id="otpInput" inputmode="numeric" maxlength="6" placeholder="Nhập mã 6 số">
      </div>
      <button class="btn" id="btnVerifyOtp" onclick="verifyOtp()">Xác nhận OTP</button>
    </div>
  `;
}

async function sendOtp(){
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  const btn = document.getElementById('btnSendOtp');
  result.innerHTML = '';
  if (!email){ result.innerHTML = '<div class="alert danger">Vui lòng nhập email trường.</div>'; return; }
  if (window.BMU_CONFIG.ALLOWED_DOMAIN && !email.endsWith('@' + window.BMU_CONFIG.ALLOWED_DOMAIN)){
    result.innerHTML = '<div class="alert danger">Vui lòng nhập email thuộc domain '+esc(window.BMU_CONFIG.ALLOWED_DOMAIN)+'.</div>'; return;
  }
  setBtnLoading(btn, 'Đang gửi mã...');
  try{
    const res = await apiGet('send-otp', { email: email });
    if (res.ok){
      document.getElementById('otpArea').classList.remove('hidden');
      result.innerHTML = '<div class="alert success">✅ '+esc(res.message || 'Đã gửi mã OTP về email trường.')+'</div>';
    }else{
      result.innerHTML = '<div class="alert danger">'+esc(res.message || 'Không gửi được OTP.')+'</div>';
    }
  }catch(err){ result.innerHTML = '<div class="alert danger">'+esc(err.message || err)+'</div>'; }
  resetBtn(btn);
}

async function verifyOtp(){
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  const otp = document.getElementById('otpInput').value.trim();
  const btn = document.getElementById('btnVerifyOtp');
  result.innerHTML = '';
  if (!otp){ result.innerHTML = '<div class="alert danger">Vui lòng nhập mã OTP.</div>'; return; }
  setBtnLoading(btn, 'Đang xác thực...');
  try{
    const res = await apiGet('verify-otp', { email: email, otp: otp });
    if (res.ok){
      currentToken = res.authToken;
      currentStudent = res.student;
      saveAuth(currentToken, email, currentStudent);
      authBox.classList.add('hidden');
      renderStudent(currentStudent);
      result.innerHTML = '<div class="alert success">✅ Xác thực thành công.</div>';
    }else{
      result.innerHTML = '<div class="alert danger">'+esc(res.message || 'OTP không hợp lệ.')+'</div>';
    }
  }catch(err){ result.innerHTML = '<div class="alert danger">'+esc(err.message || err)+'</div>'; }
  resetBtn(btn);
}

function renderStudent(s){
  studentBox.classList.remove('hidden');
  studentBox.innerHTML = `
    <div class="student-card">
      <div class="avatar">${esc(initials(s.hoTen))}</div>
      <div>
        <div class="student-name">${esc(s.hoTen)}</div>
        <div class="student-meta">${esc(s.maSV)} · Lớp ${esc(s.lop)}</div>
        <div class="student-meta">${esc(s.email)}</div>
      </div>
    </div>
    <button class="btn secondary" onclick="logoutAuth()">Đổi email xác thực</button>
  `;
  btnRegister.classList.remove('hidden');
}

function logoutAuth(){ clearAuth(); currentToken=''; currentStudent=null; result.innerHTML=''; renderAuth(); }

// ===== Cập nhật số lượng gần thời gian thực =====
let refreshTimer = null;
let submitting = false;

function startLiveRefresh(){
  stopLiveRefresh();
  refreshTimer = setInterval(refreshProgramStatus, 8000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) refreshProgramStatus();
  });
}
function stopLiveRefresh(){ if (refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; } }

async function refreshProgramStatus(){
  if (submitting || document.hidden) return;
  try{
    const p = await apiGet('program-status', { programId: programId }, 20000);
    if (!p || !p.ok) return;
    currentProgram = p;
    applyProgramLive(p);
  }catch(e){ /* bỏ qua lỗi mạng tạm thời */ }
}

function applyProgramLive(p){
  const c = document.getElementById('countValue');
  const st = document.getElementById('statusValue');
  if (c) c.textContent = p.soLuongDaDangKy || 0;
  if (st) st.textContent = p.trangThaiDangKy || '—';
  const limit = Number(p.soLuongGioiHan || 0);
  const full = (limit > 0 && Number(p.soLuongDaDangKy || 0) >= limit) || p.trangThaiDangKy === 'Đã đủ số lượng';
  if (full && !btnRegister.classList.contains('hidden') && !submitting){
    btnRegister.classList.add('hidden');
    result.innerHTML = '<div class="alert danger">Chương trình đã đủ số lượng sinh viên đăng ký.</div>';
  }
}

// ===== Đăng ký =====
const MSG_CONTACT = 'Đăng ký thất bại. Vui lòng liên hệ Phòng CTSV để được hỗ trợ.';

function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

// Khi không nhận được phản hồi rõ ràng, kiểm tra thẳng trong danh sách đăng ký
async function verifyRegistered(token){
  for (let i = 0; i < 3; i++){
    try{
      const c = await apiGet('check-registration', { programId: programId, authToken: token }, 30000);
      if (c && c.ok) return !!c.registered;
    }catch(e){}
    await sleep(2500);
  }
  return null; // không xác định được
}

function showRegisterOutcome(code, detail, refId){
  if (code === 'SUCCESS'){
    const msg = 'Đăng ký thành công.';
    result.innerHTML = '<div class="alert success">✅ '+esc(msg)+'</div>';
    showPopup('Đăng ký thành công', msg, 'success');
    btnRegister.classList.add('hidden');
  } else if (code === 'ALREADY'){
    const msg = 'Bạn đã đăng ký thành công chương trình này rồi.';
    result.innerHTML = '<div class="alert success">✅ '+esc(msg)+'</div>';
    showPopup('Đã đăng ký thành công', msg, 'success');
    btnRegister.classList.add('hidden');
  } else if (code === 'FULL'){
    const msg = 'Đăng ký thất bại. Lý do: chương trình đã đủ số lượng sinh viên đăng ký.';
    result.innerHTML = '<div class="alert danger">'+esc(msg)+'</div>';
    showPopup('Đăng ký thất bại', msg, 'danger');
    btnRegister.classList.add('hidden');
  } else {
    const msg = MSG_CONTACT + (detail ? ' (Chi tiết: ' + detail + ')' : '') + (refId ? ' Mã tham chiếu: ' + refId : '');
    result.innerHTML = '<div class="alert danger">'+esc(msg)+'</div>';
    showPopup('Đăng ký thất bại', msg, 'danger');
    resetBtn(btnRegister);
  }
}

async function submitRegistration(){
  if (submitting) return;
  const auth = getAuth();
  const token = currentToken || auth.token;
  if (!token){
    renderAuth();
    result.innerHTML='<div class="alert danger">Vui lòng xác thực email trường trước.</div>';
    showPopup('Chưa xác thực email', 'Vui lòng xác thực email trường trước khi đăng ký.', 'danger');
    return;
  }
  submitting = true;
  setBtnLoading(btnRegister, 'Đang đăng ký...');
  result.innerHTML = '';
  let code = 'ERROR', detail = '', refId = '';
  try{
    const res = await apiPost('register', { programId: programId, authToken: token }, 60000);
    refId = (res && res.requestId) || '';
    if (res && res.code){
      code = res.code;
      if (code === 'ERROR') detail = res.message || '';
    } else {
      // Không có mã rõ ràng (timeout / phản hồi lạ) → kiểm tra lại trong sheet trước khi kết luận
      result.innerHTML = '<div class="alert info">Đang kiểm tra kết quả đăng ký, vui lòng chờ...</div>';
      const registered = await verifyRegistered(token);
      if (registered === true) code = 'SUCCESS';
      else { code = 'ERROR'; detail = registered === false ? 'Chưa ghi nhận đăng ký' : 'Không xác định được kết quả'; }
    }
  }catch(err){
    const registered = await verifyRegistered(token);
    if (registered === true) code = 'SUCCESS';
    else { code = 'ERROR'; detail = (err && err.message) || ''; }
  }
  submitting = false;
  showRegisterOutcome(code, detail, refId);
  refreshProgramStatus();
}
</script>
</body>
</html>
